name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wallcraft version
      description: Shown in Settings → About
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` and copy the version and build, e.g. "Windows 11 24H2 (26100.2314)"
    validations:
      required: true
  - type: input
    id: monitors
    attributes:
      label: Monitors
      description: How many, and their resolutions / scaling
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach or paste `%LOCALAPPDATA%\Wallcraft\logs\wallcraft.log`
      render: text
