name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wallcraft version
      description: Shown in Settings → About
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: >-
        Windows: run `winver` (e.g. "Windows 11 24H2 26100.2314"). Linux: distribution, desktop and
        X11/Wayland (e.g. "Linux Mint 22.3, XFCE, X11"). macOS: version and chip (e.g. "macOS 26.1, M2").
    validations:
      required: true
  - type: input
    id: monitors
    attributes:
      label: Monitors
      description: How many, and their resolutions / scaling
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >-
        Attach or paste wallcraft.log: `%LOCALAPPDATA%\Wallcraft\logs` (Windows),
        `~/.cache/Wallcraft/logs` (Linux), `~/Library/Caches/Wallcraft/logs` (macOS)
      render: text
