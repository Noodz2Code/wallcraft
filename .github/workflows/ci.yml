name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
        python: ["3.12"]
        include:
          - os: windows-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 libxcb-cursor0
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest -q

  build-windows:
    name: Build (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Download mpv (live wallpaper player)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_mpv.py
      - name: Build portable exe
        env:
          WALLCRAFT_ONEFILE: "1"
          WALLCRAFT_REQUIRE_MPV: "1"
        run: python -m PyInstaller --noconfirm --clean wallcraft.spec
      - name: Smoke-test the packaged exe
        shell: pwsh
        run: |
          $env:WALLCRAFT_HOME = "$env:RUNNER_TEMP\wallcraft-home"
          $p = Start-Process -FilePath .\dist\Wallcraft.exe -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content "$env:WALLCRAFT_HOME\logs\wallcraft.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: Wallcraft-windows-${{ github.sha }}
          path: dist/Wallcraft.exe
          retention-days: 14

  build-linux:
    name: Build (Linux)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libpulse0 libxcb-cursor0
      - run: python -m pip install -r requirements-dev.txt
      - name: Build
        env:
          WALLCRAFT_ONEFILE: "0"
          WALLCRAFT_REQUIRE_XCB_CURSOR: "1"
        run: python -m PyInstaller --noconfirm --clean wallcraft.spec
      - name: Smoke-test the packaged app
        run: |
          export WALLCRAFT_HOME="$RUNNER_TEMP/wallcraft-home"
          ./dist/Wallcraft/Wallcraft --smoke-test || { cat "$WALLCRAFT_HOME/logs/wallcraft.log"; exit 1; }
      - name: Build AppImage
        run: scripts/build_appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Wallcraft-linux-${{ github.sha }}
          path: dist/*.AppImage
          retention-days: 14

  build-macos:
    name: Build (macOS, experimental)
    needs: test
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Build app bundle
        run: python -m PyInstaller --noconfirm --clean wallcraft.spec
      - name: Smoke-test the packaged app
        run: |
          export WALLCRAFT_HOME="$RUNNER_TEMP/wallcraft-home"
          ./dist/Wallcraft.app/Contents/MacOS/Wallcraft --smoke-test || { cat "$WALLCRAFT_HOME/logs/wallcraft.log"; exit 1; }
      - name: Build disk image
        run: scripts/build_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Wallcraft-macos-${{ github.sha }}
          path: dist/*.dmg
          retention-days: 14
